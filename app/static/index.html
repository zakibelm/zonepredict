<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <title>ZonePredict</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" aria-label="Navigation principale">
    <div class="side-top"><a class="brand" href="/placement" data-route aria-label="ZonePredict"><span class="pin">◉</span><span class="lbl">Zone<b>Predict</b></span></a>
      <button id="side-toggle" class="icon-btn" type="button" aria-label="Réduire le menu" aria-expanded="true">⟨</button></div>
    <nav>
      <a class="nav" href="/placement" data-route="placement"><span class="ic">◎</span><span class="lbl">Placement</span></a>
      <a class="nav" href="/comparaison" data-route="comparaison"><span class="ic">≋</span><span class="lbl">Prévu / vécu</span></a>
      <a class="nav" href="/statistiques" data-route="statistiques"><span class="ic">▦</span><span class="lbl">Statistiques</span></a>
      <a class="nav" href="/sante" data-route="sante"><span class="ic">◈</span><span class="lbl">Santé</span></a>
    </nav>
    <div class="side-foot"><i class="led"></i><span class="lbl"><b>DataTaxi DB</b><small>Lecture seule</small></span></div>
  </aside>

  <div class="content">
    <header class="top">
      <h1 id="page-title">Placement</h1>
      <div class="top-r"><span id="connection" class="chip is-warn" role="status" aria-live="polite">Connexion…</span><button id="refresh" class="btn" type="button" aria-label="Actualiser">↻</button></div>
    </header>

    <main class="pages">
      <!-- ============ PLACEMENT ============ -->
      <section class="page" id="page-placement" aria-label="Placement">
        <div class="bar">
          <div class="seg-btns" role="tablist" aria-label="Mode"><button id="mode-a" role="tab" class="tab on" aria-selected="true" type="button">Prévision officielle</button><button id="mode-b" role="tab" class="tab" aria-selected="false" type="button">Explorer</button></div>
          <div id="pl-nav" class="nav-hour">
            <div id="pl-days" class="days"></div>
            <button id="pl-prev" class="btn" type="button" aria-label="Heure précédente">◀</button>
            <select id="pl-hour" aria-label="Heure"></select>
            <button id="pl-next" class="btn" type="button" aria-label="Heure suivante">▶</button>
            <button id="pl-now" class="btn" type="button">Maintenant</button>
          </div>
          <select id="pl-seg" aria-label="Jours historiques utilisés" hidden><option value="weekday">Même jour de semaine</option><option value="all">Tous les jours</option></select>
          <select id="pl-filter" aria-label="Signaux affichés"><option value="mf">Moyen + Fort</option><option value="f">Fort seulement</option><option value="all">Tous (avec Faible)</option></select>
          <span class="info-wrap"><button id="pl-info" class="icon-btn" type="button" aria-label="À propos de cette vue" aria-expanded="false">ⓘ</button><div id="pl-info-pop" class="pop" hidden></div></span>
        </div>
        <div id="pl-title-line" class="slot-line"></div>
        <div class="pl-main">
          <section class="card matrix-card" aria-label="Matrice zones et tranches">
            <div id="pl-matrix" class="matrix-area"></div>
            <div class="matrix-foot"><div id="pl-pager" class="pager"></div><div class="legend"><span><i class="lg lg-1"></i>peu</span><span><i class="lg lg-2"></i>quelques-uns</span><span><i class="lg lg-3"></i>beaucoup</span><span><i class="lg lg-red"></i>Fort</span></div></div>
          </section>
          <aside id="pl-side" class="card side-panel" aria-live="polite" aria-label="Détail du signal"></aside>
        </div>
      </section>

      <!-- ============ COMPARAISON ============ -->
      <section class="page" id="page-comparaison" aria-label="Prévu et vécu">
        <div class="bar"><span id="bm-tag" class="chip">En attente</span><span id="bm-slot" class="slot-line"></span>
          <div class="seg-btns" role="tablist" aria-label="Vue"><button class="tab on" data-bm="zones" role="tab" type="button">Zone × tranche</button><button class="tab" data-bm="conf" role="tab" type="button">Confiance</button><button class="tab" data-bm="acc" role="tab" type="button">Précision</button></div>
          <select id="bm-range" aria-label="Période"><option value="24h">24 h</option><option value="7d" selected>7 jours</option><option value="all">Tout</option></select></div>
        <div id="bm-cards" class="bm-3"></div>
        <section class="card fill" id="bm-pane"><div id="bm-zones" class="pane on"></div><div id="bm-conf" class="pane chart"></div><div id="bm-acc" class="pane chart"></div></section>
      </section>

      <!-- ============ STATISTIQUES ============ -->
      <section class="page" id="page-statistiques" aria-label="Statistiques">
        <div class="bar"><div class="seg-btns" role="tablist" aria-label="Groupe"><button class="tab on" data-st="volume" role="tab" type="button">Volume</button><button class="tab" data-st="types" role="tab" type="button">Types d’appels</button><button class="tab" data-st="heure" role="tab" type="button">Jour et heure</button><button class="tab" data-st="zones" role="tab" type="button">Zones</button></div>
          <select id="period" aria-label="Période"><option value="today">Aujourd’hui</option><option value="yesterday">Hier</option><option value="week">Cette semaine</option><option value="month">Ce mois</option><option value="7d" selected>7 jours</option><option value="30d">30 jours</option><option value="all">Tout l’historique</option><option value="custom">Jour ou plage…</option></select>
          <span id="custom-range" hidden><input id="range-start" type="date" aria-label="Début"> → <input id="range-end" type="date" aria-label="Fin"></span></div>
        <div class="kpis"><div class="kpi"><span>Appels enregistrés</span><b id="k-total">—</b></div><div class="kpi"><span>Pris en compte</span><b id="k-eligible">—</b></div><div class="kpi"><span>Zones actives</span><b id="k-zones">—</b></div><div class="kpi"><span>Jours avec données</span><b id="k-days">—</b></div></div>
        <section class="card fill"><div class="pane on" data-stp="volume"><div id="daily-chart" class="chart"></div></div>
          <div class="pane" data-stp="types"><div class="quota-grid"><div class="donut" id="donut"><div class="donut-inner"><strong id="donut-total">—</strong><span>appels</span></div></div><div id="quota-list" class="quota-list"></div></div></div>
          <div class="pane" data-stp="heure"><div id="heatmap" class="heatmap-holder"></div></div>
          <div class="pane" data-stp="zones"><div id="zones-table" class="table-wrap"></div></div></section>
      </section>

      <!-- ============ SANTÉ ============ -->
      <section class="page" id="page-sante" aria-label="Santé des données">
        <div class="bar"><span id="source-state" class="chip">Non vérifié</span><span id="last-render" class="slot-line"></span></div>
        <section class="card fill"><div id="system-status" class="system-box"></div></section>
      </section>
    </main>
  </div>
</div>
</body>
</html>
