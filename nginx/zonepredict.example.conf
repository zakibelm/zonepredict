# Exemple à adapter au domaine et au certificat SSL existants.
# Le service FastAPI écoute uniquement 127.0.0.1:8199 sur le VPS.
# Activer Nginx basic auth ou contrôle d'accès SSO AVANT d'ouvrir le sous-domaine.
server {
    listen 443 ssl http2;
    server_name zonepredict.VOTRE-DOMAINE.TLD;
    ssl_certificate /etc/letsencrypt/live/zonepredict.VOTRE-DOMAINE.TLD/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zonepredict.VOTRE-DOMAINE.TLD/privkey.pem;

    auth_basic "ZonePredict - accès privé";
    auth_basic_user_file /etc/nginx/zonepredict.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location / {
      proxy_pass http://127.0.0.1:8199;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 30s;
    }
}
