services:
  zonepredict-dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      # Exposition locale uniquement. HTTPS + auth à appliquer dans Nginx sur le VPS.
      - "127.0.0.1:8199:8000"
    volumes:
      - zonepredict_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
volumes:
  zonepredict_data:
